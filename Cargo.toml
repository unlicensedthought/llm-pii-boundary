[package]
name = "llm-pii-boundary"
version = "0.1.0"
edition = "2021"
description = "A reversible PII boundary for LLM calls: redact to placeholders before a request leaves, restore once at the end, and test the outbound-leak property with planted identifiers."
license = "Apache-2.0"
publish = false

[dependencies]
serde_json = "1"

[[bin]]
name = "pii-eval"
path = "src/bin/pii_eval.rs"
